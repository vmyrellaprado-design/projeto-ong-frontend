<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Projeto ONG</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <header>
        <h1>Cadastro</h1>

        <button class="menu-toggle" aria-label="Abrir menu">☰</button>

        <nav class="menu">
            <a href="index.html">Início</a>

            <div class="dropdown">
                <a href="projetos.html">Projetos</a>

                <div class="submenu">
                    <a href="projetos.html">Projetos sociais</a>
                    <a href="cadastro.html">Quero ajudar</a>
                </div>
            </div>

            <a href="cadastro.html">Cadastro</a>
        </nav>
    </header>


    <main>

        <h2>Faça parte da nossa ONG</h2>

        <p>
            Preencha o formulário abaixo para participar das ações
            e projetos realizados pela nossa ONG.
        </p>


        <form>

            <fieldset>

                <legend>Dados pessoais</legend>

                <label for="nome">Nome completo:</label>
                <input
                    type="text"
                    id="nome"
                    name="nome"
                    required
                >

                <br><br>


                <label for="email">E-mail:</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="exemplo@email.com"
                    required
                >

                <br><br>


                <label for="nascimento">Data de nascimento:</label>
                <input
                    type="date"
                    id="nascimento"
                    name="nascimento"
                    required
                >

                <br><br>


                <label for="cpf">CPF:</label>
                <input
                    type="text"
                    id="cpf"
                    name="cpf"
                    placeholder="000.000.000-00"
                    pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}"
                    maxlength="14"
                    required
                >

            </fieldset>


            <fieldset>

                <legend>Contato e endereço</legend>

                <label for="telefone">Telefone:</label>
                <input
                    type="tel"
                    id="telefone"
                    name="telefone"
                    placeholder="(00) 00000-0000"
                    pattern="\([0-9]{2}\) [0-9]{5}-[0-9]{4}"
                    maxlength="15"
                    required
                >

                <br><br>


                <label for="cep">CEP:</label>
                <input
                    type="text"
                    id="cep"
                    name="cep"
                    placeholder="00000-000"
                    pattern="[0-9]{5}-[0-9]{3}"
                    maxlength="9"
                    required
                >

                <br><br>


                <label for="endereco">Endereço:</label>
                <input
                    type="text"
                    id="endereco"
                    name="endereco"
                    required
                >

                <br><br>


                <label for="cidade">Cidade:</label>
                <input
                    type="text"
                    id="cidade"
                    name="cidade"
                    required
                >

                <br><br>


                <label for="estado">Estado:</label>
                <input
                    type="text"
                    id="estado"
                    name="estado"
                    required
                >

            </fieldset>


            <button type="submit">Enviar cadastro</button>

        </form>

    </main>


    <footer>
        <p>Projeto ONG - 2026</p>
    </footer>


    <script>
        const botaoMenu = document.querySelector('.menu-toggle');
        const menu = document.querySelector('.menu');

        botaoMenu.addEventListener('click', function () {
            menu.classList.toggle('menu-aberto');
        });
    </script>

</body>

</html>
