<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Projeto ONG</title>

    <link rel="stylesheet" href="../css/style.css">

    <!-- Biblioteca externa SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>

    <header>
        <h1>Projeto ONG</h1>

        <button class="menu-toggle" aria-label="Abrir menu">
            ☰
        </button>

        <nav class="menu">

            <a href="#inicio" data-rota="inicio">
                Início
            </a>

            <div class="dropdown">

                <a href="#projetos" data-rota="projetos">
                    Projetos
                </a>

                <div class="submenu">

                    <a href="#projetos" data-rota="projetos">
                        Projetos sociais
                    </a>

                    <a href="#cadastro" data-rota="cadastro">
                        Quero ajudar
                    </a>

                </div>

            </div>

            <a href="#cadastro" data-rota="cadastro">
                Cadastro
            </a>

        </nav>

    </header>


    <!-- Área principal da SPA -->

    <div id="conteudo"></div>


    <!-- Template da página inicial -->

    <template id="inicio">

        <main class="grid">

            <img
                src="../imagens/ong-png.png"
                alt="Imagem do Projeto ONG com cachorro e gato"
                width="500"
            >

            <section>

                <h2>Sobre a ONG</h2>

                <p>
                    Nossa ONG desenvolve ações sociais para animais em
                    vulnerabilidade da comunidade e incentiva a participação
                    de voluntários.
                </p>

            </section>


            <section>

                <h2>Projetos sociais</h2>

                <p>
                    Realizamos projetos de apoio a animais carentes,
                    campanhas de doação e atividades de voluntariado.
                </p>

            </section>


            <section>

                <h2>Contato</h2>

                <p>
                    E-mail: contato@projetoong.org
                </p>

                <p>
                    Telefone: (41) 99999-9999
                </p>

            </section>

        </main>


        <section class="feedback">

            <h2>Como ajudar</h2>

            <span class="badge">
                Voluntariado
            </span>

            <span class="badge">
                Doações
            </span>

            <div class="alerta">
                Sua ajuda faz a diferença para os animais atendidos pelo projeto.
            </div>

        </section>

    </template>


    <!-- Template da página de projetos -->

    <template id="projetos">

        <main>

            <section>

                <h2>Nossos projetos</h2>

                <p>
                    Conheça algumas das ações realizadas pelo Projeto ONG
                    para ajudar animais em situação de vulnerabilidade e
                    incentivar a participação da comunidade.
                </p>

            </section>

            <div
                class="cards"
                id="lista-projetos">
            </div>

        </main>

    </template>


    <!-- Template da página de cadastro -->

    <template id="cadastro">

        <main>

            <h2>
                Faça parte da nossa ONG
            </h2>

            <p>
                Preencha o formulário abaixo para participar das ações
                e projetos realizados pela nossa ONG.
            </p>


            <form id="form-cadastro" novalidate>

                <fieldset>

                    <legend>
                        Dados pessoais
                    </legend>


                    <label for="nome">
                        Nome completo:
                    </label>

                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        required
                    >

                    <small
                        class="mensagem-erro"
                        id="erro-nome">
                    </small>

                    <br><br>


                    <label for="email">
                        E-mail:
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="exemplo@email.com"
                        required
                    >

                    <small
                        class="mensagem-erro"
                        id="erro-email">
                    </small>

                    <br><br>


                    <label for="nascimento">
                        Data de nascimento:
                    </label>

                    <input
                        type="date"
                        id="nascimento"
                        name="nascimento"
                        required
                    >

                    <small
                        class="mensagem-erro"
                        id="erro-nascimento">
                    </small>

                    <br><br>


                    <label for="cpf">
                        CPF:
                    </label>

                    <input
                        type="text"
                        id="cpf"
                        name="cpf"
                        placeholder="000.000.000-00"
                        maxlength="14"
                        required
                    >

                    <small
                        class="mensagem-erro"
                        id="erro-cpf">
                    </small>

                </fieldset>


                <fieldset>

                    <legend>
                        Contato e endereço
                    </legend>


                    <label for="telefone">
                        Telefone:
                    </label>

                    <input
                        type="tel"
                        id="telefone"
                        name="telefone"
                        placeholder="(00) 00000-0000"
                        maxlength="15"
                        required
                    >

                    <small
                        class="mensagem-erro"
                        id="erro-telefone">
                    </small>

                    <br><br>


                    <label for="cep">
                        CEP:
                    </label>

                    <input
                        type="text"
                        id="cep"
                        name="cep"
                        placeholder="00000-000"
                        maxlength="9"
                        required
                    >

                    <small
                        class="mensagem-erro"
                        id="erro-cep">
                    </small>

                    <br><br>


                    <label for="endereco">
                        Endereço:
                    </label>

                    <input
                        type="text"
                        id="endereco"
                        name="endereco"
                        required
                    >

                    <small
                        class="mensagem-erro"
                        id="erro-endereco">
                    </small>

                    <br><br>


                    <label for="cidade">
                        Cidade:
                    </label>

                    <input
                        type="text"
                        id="cidade"
                        name="cidade"
                        required
                    >

                    <small
                        class="mensagem-erro"
                        id="erro-cidade">
                    </small>

                    <br><br>


                    <label for="estado">
                        Estado:
                    </label>

                    <input
                        type="text"
                        id="estado"
                        name="estado"
                        required
                    >

                    <small
                        class="mensagem-erro"
                        id="erro-estado">
                    </small>

                </fieldset>


                <button type="submit">
                    Enviar cadastro
                </button>

            </form>

        </main>

    </template>


    <footer>

        <p>
            Projeto ONG - 2026
        </p>

    </footer>


    <!-- Arquivos JavaScript separados por funcionalidade -->

    <script src="../js/dados.js"></script>
    <script src="../js/storage.js"></script>
    <script src="../js/projetos.js"></script>
    <script src="../js/formulario.js"></script>
    <script src="../js/main.js"></script>

</body>

</html>
